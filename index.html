<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Price vs Volume — Grade 8</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,800;9..40,900&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg1:#fddcb5;--bg2:#dff2e0;
  --card:#fff;--border:#1a1a2e;
  --ink:#1a1a2e;--ink2:#4a4a5a;--ink3:#9090a0;
  --teal:#4ecdc4;--orange:#ff6b35;--yellow:#ffd93d;--red:#e63946;--purple:#a78bfa;
  --sans:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;
}
html{background:linear-gradient(135deg,var(--bg1) 0%,#fef6e8 50%,var(--bg2) 100%);min-height:100vh}
body{font-family:var(--sans);color:var(--ink);min-height:100vh;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:0}

/* PAGE WRAPPER — the big white card */
.page-card{background:var(--card);border:2px solid var(--border);border-radius:24px;width:100%;max-width:940px;overflow:hidden;position:relative}

/* HEADER inside card */
.card-header{padding:28px 36px 20px;border-bottom:1px dashed #d0d0d8}
.activity-pill{display:inline-flex;align-items:center;gap:6px;background:var(--yellow);border:2px solid var(--border);border-radius:30px;padding:4px 14px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.activity-pill::before{content:'★';font-size:10px}
.page-title{font-size:clamp(26px,4vw,42px);font-weight:900;line-height:1.05;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.title-pill{background:var(--teal);color:#fff;border:2px solid var(--border);border-radius:14px;padding:4px 18px;font-style:italic;font-size:inherit;display:inline-block}
.title-pill.orange{background:var(--orange)}
.page-desc{font-size:15px;color:var(--ink2);line-height:1.6;max-width:560px}
.page-desc em{color:var(--red);font-style:italic;font-weight:700}

/* TWO-COLUMN LAYOUT */
.card-body{display:grid;grid-template-columns:1fr 300px;min-height:400px}

/* LEFT: BARS + TABLE */
.left-col{padding:24px 28px;border-right:1px dashed #d0d0d8;display:flex;flex-direction:column;gap:20px}

/* RIGHT: PANELS */
.right-col{padding:20px 20px;display:flex;flex-direction:column;gap:16px}

/* SECTION LABEL */
.sec-lbl{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.sec-name{font-size:14px;font-weight:800;color:var(--ink)}
.sec-rule{flex:1;border:none;border-top:1px dashed #d0d0d8}

/* BAR CHART */
.bar-chart{display:flex;align-items:flex-end;gap:14px;min-height:200px;overflow-x:auto;padding-top:40px;padding-bottom:4px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0;min-width:64px}
.bar-rate{font-family:var(--mono);font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:6px;border:1.5px solid;white-space:nowrap;text-align:center}
.bar-body{width:52px;border-radius:10px 10px 0 0;border:2px solid;transition:height .35s;min-height:8px}
.bar-ground{width:52px;height:3px;border-radius:0}
.bar-name{font-size:12px;font-weight:700;color:var(--ink2);margin-top:6px}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:14px}
.data-table th{padding:7px 10px;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);border-bottom:2px solid var(--border)}
.data-table td{padding:8px 10px;border-bottom:1px solid #e8e8e8;vertical-align:middle}
.data-table td:nth-child(2),.data-table td:nth-child(4){font-family:var(--mono)}
.name-tag{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:700;font-size:13px;border:1.5px solid}
.price-inp{width:76px;padding:5px 8px;border:1.5px solid #d0d0d8;border-radius:8px;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);outline:none;transition:border-color .15s}
.price-inp:focus{border-color:var(--teal)}
.rate-num{font-weight:700;font-family:var(--mono);font-size:14px}
.deal-tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid}
.del-x{width:28px;height:28px;border:1.5px solid #d0d0d8;border-radius:8px;background:transparent;color:var(--ink3);cursor:pointer;font-size:13px;transition:all .12s}
.del-x:hover{border-color:var(--red);color:var(--red)}
.table-btns{display:flex;gap:8px;margin-top:10px}
.btn{padding:9px 20px;border:2px solid var(--border);border-radius:30px;font-family:var(--sans);font-size:13px;font-weight:800;cursor:pointer;transition:all .15s}
.btn-add{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-add:hover{background:#3ab5ac}
.btn-reset{background:transparent;color:var(--ink2)}
.btn-reset:hover{background:#f5f5f5}

/* RIGHT PANELS */
.info-card{background:#fff;border:2px solid var(--border);border-radius:18px;padding:16px 16px;overflow:hidden}
.verdict{font-size:14px;font-weight:700;padding:12px 16px;border-radius:12px;border:2px solid}
.verdict.ok{background:#e8faf9;border-color:var(--teal);color:#2a8f89}
.verdict.fail{background:#fef0ee;border-color:var(--orange);color:#c0441e}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dashed #e0e0e0}
.stat-row:last-child{border-bottom:none}
.stat-lbl{font-size:12px;color:var(--ink3);font-weight:600}
.stat-val{font-family:var(--mono);font-size:15px;font-weight:700}
.insight{font-size:13px;line-height:1.6;color:var(--ink2)}
.insight strong{color:var(--ink);font-weight:700}

/* FLOATING SHAPES */
.shape{position:fixed;pointer-events:none;z-index:-1}
.sh-circle{width:56px;height:56px;border-radius:50%;background:#ff6b6b;opacity:.7;top:80px;left:calc(50% - 520px)}
.sh-triangle{width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:38px solid var(--teal);opacity:.7;bottom:200px;right:calc(50% - 520px)}
.sh-star{font-size:36px;line-height:1;opacity:.6;top:200px;right:calc(50% - 520px)}
.sh-square{width:38px;height:38px;border-radius:8px;background:var(--purple);opacity:.6;bottom:100px;left:calc(50% - 500px);transform:rotate(15deg)}

@media(max-width:720px){
  body{padding:16px 12px}
  .card-body{grid-template-columns:1fr}
  .left-col{border-right:none;border-bottom:1px dashed #d0d0d8}
  .card-header{padding:20px 20px 16px}
}
</style>
</head>
<body>

<!-- Floating decorative shapes -->
<div class="shape sh-circle"></div>
<div class="shape sh-triangle"></div>
<div class="shape sh-star">★</div>
<div class="shape sh-square"></div>

<div class="page-card">
  <div class="card-header">
    <div class="activity-pill">Ch 7 · Proportion</div>
    <div class="page-title">
      Price vs <span class="title-pill">Volume</span> — fair deal?
    </div>
    <p class="page-desc">If price is proportional to volume, every size has the <em>same ₹ per unit</em>. Edit any price and watch the bars update.</p>
  </div>

  <div class="card-body">
    <div class="left-col">
      <!-- BAR CHART -->
      <div>
        <div class="sec-lbl"><div class="sec-dot" style="background:var(--teal)"></div><span class="sec-name">₹ per 100 units — equal height = proportional</span><hr class="sec-rule"></div>
        <div class="bar-chart" id="bar-chart"></div>
      </div>

      <!-- TABLE -->
      <div>
        <div class="sec-lbl"><div class="sec-dot" style="background:var(--orange)"></div><span class="sec-name">Edit prices</span><hr class="sec-rule"></div>
        <table class="data-table">
          <thead><tr><th>Size</th><th>Volume</th><th>Price (₹)</th><th>Per 100</th><th>Deal</th><th></th></tr></thead>
          <tbody id="tbl-body"></tbody>
        </table>
        <div class="table-btns">
          <button class="btn btn-add" id="btn-add">+ Add size</button>
          <button class="btn btn-reset" id="btn-reset">Reset</button>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="sec-lbl"><div class="sec-dot" style="background:var(--yellow)"></div><span class="sec-name">Result</span><hr class="sec-rule"></div>
      <div class="verdict" id="verdict"></div>

      <div class="info-card">
        <div class="sec-lbl" style="margin-bottom:8px"><div class="sec-dot" style="background:var(--purple)"></div><span class="sec-name">Stats</span><hr class="sec-rule"></div>
        <div id="stats"></div>
      </div>

      <div class="info-card">
        <div class="sec-lbl" style="margin-bottom:8px"><div class="sec-dot" style="background:var(--teal)"></div><span class="sec-name">Insight</span><hr class="sec-rule"></div>
        <p class="insight" id="insight"></p>
      </div>
    </div>
  </div>
</div>

<script>
const C=['#4ecdc4','#ff6b35','#ffd93d','#a78bfa','#e63946','#2a9d8f'];
const CB=['#e8faf9','#fef0ee','#fffbe6','#f3eeff','#fef0f0','#e8f7f5'];
const DEF=[{n:'Small',v:100,p:18},{n:'Medium',v:250,p:42},{n:'Large',v:500,p:80},{n:'XL',v:1000,p:155}];
let rows=DEF.map(r=>({...r}));

function rate(r){return r.p/r.v*100}

function render(){
  const rates=rows.map(rate);
  const mn=Math.min(...rates),mx=Math.max(...rates);
  const prop=mx-mn<.01;
  const maxH=mx*1.15||10;

  /* bars */
  const bc=document.getElementById('bar-chart');bc.innerHTML='';
  rows.forEach((r,i)=>{
    const rt=rate(r),h=Math.max(12,Math.round(rt/maxH*130));
    const col=C[i%C.length],cbg=CB[i%CB.length];
    const d=document.createElement('div');d.className='bar-col';
    d.innerHTML=`<div class="bar-rate" style="color:${col};border-color:${col};background:${cbg}">₹${rt.toFixed(1)}</div>
      <div class="bar-body" style="height:${h}px;background:${cbg};border-color:${col}"></div>
      <div class="bar-ground" style="background:${col}"></div>
      <div class="bar-name">${r.n}</div>`;
    bc.appendChild(d);
  });

  /* table */
  const tb=document.getElementById('tbl-body');tb.innerHTML='';
  rows.forEach((r,i)=>{
    const rt=rate(r),col=C[i%C.length],cbg=CB[i%CB.length];
    const isBest=Math.abs(rt-mn)<.01,isWorst=Math.abs(rt-mx)<.01&&!prop;
    const dealCol=prop?'#9090a0':isBest?C[0]:isWorst?C[4]:'#9090a0';
    const dealBg=prop?'#f5f5f5':isBest?CB[0]:isWorst?CB[4]:'#f5f5f5';
    const dealTxt=prop?'Fair':isBest?'🏆 Best':isWorst?'😬 Pricey':'Ok';
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><span class="name-tag" style="color:${col};border-color:${col};background:${cbg}">${r.n}</span></td>
      <td>${r.v}</td>
      <td><input class="price-inp" type="number" value="${r.p}" min="1" max="9999" step=".5" data-i="${i}"></td>
      <td><span class="rate-num" style="color:${col}">₹${rt.toFixed(2)}</span></td>
      <td><span class="deal-tag" style="color:${dealCol};border-color:${dealCol};background:${dealBg}">${dealTxt}</span></td>
      <td><button class="del-x" data-i="${i}">✕</button></td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('.price-inp').forEach(el=>{
    el.addEventListener('input',e=>{const v=parseFloat(e.target.value);if(v>0)rows[+e.target.dataset.i].p=v;render();});
  });
  tb.querySelectorAll('.del-x').forEach(el=>{
    el.addEventListener('click',e=>{if(rows.length>2)rows.splice(+e.target.dataset.i,1);render();});
  });

  /* verdict */
  const vd=document.getElementById('verdict');
  vd.className='verdict '+(prop?'ok':'fail');
  vd.textContent=prop?'✓ Proportional — same ₹ per unit for every size.':'✗ Not proportional — rate varies between sizes.';

  /* stats */
  document.getElementById('stats').innerHTML=`
    <div class="stat-row"><span class="stat-lbl">Cheapest per 100u</span><span class="stat-val" style="color:${C[0]}">₹${mn.toFixed(2)}</span></div>
    <div class="stat-row"><span class="stat-lbl">Priciest per 100u</span><span class="stat-val" style="color:${C[4]}">₹${mx.toFixed(2)}</span></div>
    <div class="stat-row"><span class="stat-lbl">Gap</span><span class="stat-val">₹${(mx-mn).toFixed(2)}</span></div>`;

  /* insight */
  const bi=rows[rates.indexOf(mn)],wi=rows[rates.indexOf(mx)];
  document.getElementById('insight').innerHTML=prop
    ?`All sizes cost <strong>₹${mn.toFixed(2)}</strong> per 100 units — price is directly proportional to volume.`
    :`<strong>${bi.n}</strong> gives best value (₹${mn.toFixed(2)}/100u). <strong>${wi.n}</strong> is the priciest (₹${mx.toFixed(2)}/100u). Proportional pricing would make all bars equal.`;
}

document.getElementById('btn-add').addEventListener('click',()=>{
  const used=rows.map(r=>r.v);
  const next=[100,200,300,400,500,600,750,1000,1500,2000].find(v=>!used.includes(v))||rows.at(-1).v+100;
  rows.push({n:'Size '+(rows.length+1),v:next,p:+(rate(rows[0])*next/100).toFixed(0)});render();
});
document.getElementById('btn-reset').addEventListener('click',()=>{rows=DEF.map(r=>({...r}));render();});
render();
</script>
</body>
</html>
